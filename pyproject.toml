[project]
name = "easyrl"
version = "0.1.0"
description = "A user-friendly Python library for Reinforcement Learning."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "EasyRL Team", email = "team@easyrl.dev"},
]
keywords = ["reinforcement-learning", "rl", "machine-learning", "ai", "easyrl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "stable-baselines3",
    "gymnasium",
    "torch",
    "ray[rllib]",
    "typer",
    "rich",
    "sphinx",
    "pytest",
    "numpy",
    "tensorboard",
]

[project.urls]
Homepage = "https://github.com/username/easyrl"

[project.scripts]
easyrl = "easyrl.cli.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["easyrl*" ]

[tool.uv]
package = true
